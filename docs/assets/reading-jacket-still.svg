          <path d="M33 155h86m-86 11h86m-86 11h69m-69 11h79m-79 11h62" stroke="#59616b" stroke-width="1.7"/>
        </g>
        <path d="M69 232h14" stroke="#8d8e96" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

