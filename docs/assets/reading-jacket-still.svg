        <path d="M10 13h209q12 0 12 12v292q0 12-12 12H10q-10 0-10-10V26q0-13 10-13Z" fill="#7f2827" stroke="#51212b"/>
        <path d="M8 14h219v299q0 10-10 10H8Z" fill="url(#pages)"/>
        <path d="M14 311h211m-211 4h207m-207 4h201m4-298v288m4-284v283" fill="none" stroke="#99714f" stroke-opacity=".76"/>
