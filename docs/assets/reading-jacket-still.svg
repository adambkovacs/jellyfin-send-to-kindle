        <rect x="8" y="11" width="152" height="250" rx="15" fill="#3b1a28" opacity=".53"/>
        <rect width="152" height="250" rx="14" fill="#151b2b" stroke="#78604f" stroke-width="1.3"/>
        <rect x="5" y="5" width="142" height="239" rx="10" fill="none" stroke="#6c7180" stroke-opacity=".65"/>
        <rect x="13" y="14" width="126" height="204" rx="3" fill="#e4d8b8"/>
        <rect x="13" y="14" width="126" height="204" rx="3" fill="url(#weave)"/>
