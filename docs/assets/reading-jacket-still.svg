          <rect width="222" height="310" rx="7" fill="url(#weave)" opacity=".88"/>
          <path d="M20 2v306m-9-304v301" stroke="#761f22" stroke-width="2" opacity=".76"/>
          <path d="M17 49h-16m16 8h-16m16 193h-16m16 8h-16" stroke="#e9aa69" stroke-opacity=".77" stroke-width="2"/>
