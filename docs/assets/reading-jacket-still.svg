<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Books to Kindle for Jellyfin</title>
  <desc id="description">A vermilion clothbound book opens beside an e-reader. The engraving on the book appears again on the reader's screen.</desc>
  <defs>
    <clipPath id="jacket"><rect width="1200" height="560" rx="8"/></clipPath>
    <linearGradient id="ink" x2="1" y2="1">
      <stop stop-color="#222a3d"/>
      <stop offset="1" stop-color="#111625"/>
    </linearGradient>
    <linearGradient id="field" x2=".8" y2="1">
      <stop stop-color="#dc503a"/>
      <stop offset="1" stop-color="#9f3028"/>
    </linearGradient>
    <linearGradient id="cloth" x2="1" y2="1">
      <stop stop-color="#c83d2d"/>
      <stop offset=".12" stop-color="#9b2f26"/>
      <stop offset=".28" stop-color="#d64a34"/>
      <stop offset="1" stop-color="#ad3028"/>
    </linearGradient>
    <linearGradient id="pages" x2="1" y2=".3">
      <stop stop-color="#bca27b"/>
      <stop offset=".19" stop-color="#f6e8ca"/>
      <stop offset=".83" stop-color="#ead7ad"/>
      <stop offset="1" stop-color="#c8ad81"/>
    </linearGradient>
    <pattern id="weave" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 .5h5m-4 1v3m2-2v2" fill="none" stroke="#f5e8c9" stroke-opacity=".13" stroke-width=".55"/>
      <path d="M0 3.5h5m-3-3v1m2 2v1" fill="none" stroke="#0b1424" stroke-opacity=".26" stroke-width=".65"/>
    </pattern>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(41)">
      <path d="M.5 0v6m3 0V0" stroke="#e9c888" stroke-opacity=".2" stroke-width=".8"/>
    </pattern>
    <g id="engraving" fill="none" stroke="currentColor">
      <path d="M-56 39V-4a56 59 0 0 1 112 0v43Z" stroke-width="1.8"/>
      <path d="M-50 33V-4a50 52 0 0 1 100 0v37Z"/>
      <path d="M-50 18c17-22 35-22 50-13 17-11 35-8 50 3M-50 25c21-12 36-12 53-7 15-5 31-6 47-2M-50 29c22-8 39-7 54-4 18-5 34-4 46-3M-50 33c18-4 36-4 54-2 14-2 29-3 46-3"/>
      <circle cy="-19" r="12"/>
      <path d="M0-42v6m0 34v6m-23-23h6m34 0h6m-39-16 5 5m22 22 5 5M-16-3l5-5m22-22 5-5"/>
    </g>
    <path id="star" d="M0-10C.8-3 3-.8 10 0 3 .8.8 3 0 10-.8 3-3 .8-10 0-3-.8-.8-3 0-10Z"/>
  </defs>
  <style>
    .open-surface { opacity: 0; }
    .open-surface .pastedown { opacity: 1; }
  </style>

  <g clip-path="url(#jacket)">
    <path d="M0 0h1200v560H0Z" fill="url(#ink)"/>
    <path d="M0 0h1200v560H0Z" fill="url(#weave)" opacity=".33"/>
    <path d="M689 0h511v560H617Z" fill="url(#field)"/>
    <path d="M689 0h511v560H617Z" fill="url(#weave)" opacity=".75"/>
    <path d="M684 0 612 560m80-560-72 560" stroke="#e9bf78" stroke-opacity=".54"/>
    <path d="M36 36h1128v488H36Z" fill="none" stroke="#d5a96d" stroke-opacity=".60"/>
    <path d="M36 59V36h23m1082 0h23v23m0 442v23h-23m-1082 0H36v-23" fill="none" stroke="#edcb89" stroke-width="2"/>
    <path d="M68 125h489m-489 334h489M68 125v11m489-11v11M68 448v11m489-11v11" fill="none" stroke="#cfa365" stroke-opacity=".77"/>
    <use href="#star" transform="translate(82 93) scale(.75)" fill="#e5c27e"/>
    <text x="105" y="101" fill="#e5c27e" font-family="'Avenir Next', Verdana, sans-serif" font-weight="650" font-size="25" letter-spacing="5">FOR JELLYFIN</text>
    <text x="65" y="253" fill="#f3e7cd" font-family="Baskerville, Georgia, serif" font-size="124" textLength="492" lengthAdjust="spacingAndGlyphs">Books to</text>
    <text x="63" y="408" fill="#f57b5e" font-family="Baskerville, Georgia, serif" font-size="190" font-style="italic" textLength="490" lengthAdjust="spacingAndGlyphs">Kindle</text>

    <g fill="none" stroke="#f1c888">
