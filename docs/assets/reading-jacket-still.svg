      <circle cx="916" cy="281" r="225" stroke-opacity=".41"/>
      <circle cx="916" cy="281" r="189" stroke-opacity=".3"/>
      <path d="M687 466h444m-444 10h444M916 56v26m0 398v26M692 281h22m405 0h22" stroke-opacity=".62"/>
    </g>
    <path d="M716 408a213 213 0 0 0 400 0Z" fill="url(#hatch)"/>
    <use href="#star" transform="translate(1108 101) scale(1.55)" fill="#f4d08b"/>
    <use href="#star" transform="translate(710 389) scale(.75)" fill="#f4d08b"/>
    <use href="#star" transform="translate(1125 443) scale(.6)" fill="#f4d08b"/>

    <g transform="translate(986 151) rotate(12)">
