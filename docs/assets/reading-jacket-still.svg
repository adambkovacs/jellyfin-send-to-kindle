          <rect x="37" y="21" width="164" height="268" rx="1" fill="none" stroke="#e9bc76" stroke-opacity=".65"/>
          <use href="#star" fill="#efd098" transform="translate(119 79) scale(.9)"/>
          <use href="#engraving" transform="translate(119 156) scale(1.15)" color="#efd098"/>
          <path d="M61 230h116m-102 7h88" stroke="#efd098" stroke-opacity=".85"/>
          <use href="#star" fill="#efd098" transform="translate(119 261) scale(.56)"/>
          <g class="pastedown motion" opacity="0">
            <rect x="1" y="1" width="220" height="308" rx="7" fill="#992e27"/>
            <rect x="17" y="13" width="191" height="285" rx="2" fill="#dca96e"/>
            <rect x="17" y="13" width="191" height="285" rx="2" fill="url(#hatch)"/>
            <path d="M28 24h169v263H28Z" fill="none" stroke="#8b4c39"/>
          </g>
        </g>
        <path d="M0 0Q98 7 217 0v310Q109 302 0 310Z" fill="url(#pages)" stroke="#b28a65"/>
        <use href="#engraving" transform="translate(111 110) scale(.92)" color="#84624d"/>
        <path d="M30 160h162m-162 13h162m-162 13h143m-143 24h162m-162 13h162m-162 13h119" stroke="#84624d" stroke-opacity=".65" stroke-width="2"/>
        <g class="leaf-one motion">
          <path d="M0 0Q108-8 217 0v310Q106 302 0 310Z" fill="url(#pages)" stroke="#b28a65"/>
          <use href="#engraving" transform="translate(110 115) scale(.85)" color="#7d5945"/>
          <path d="M33 178h160m-160 13h160m-160 13h147m-147 13h160m-160 13h118" stroke="#946f55" stroke-opacity=".8" stroke-width="2"/>
        </g>
        <g class="leaf-two motion">
          <path d="M0 0Q98 7 215 0v309Q102 315 0 309Z" fill="url(#pages)" stroke="#a47958"/>
          <path d="M26 72h162m-162 13h162m-162 13h143m-143 27h162m-162 13h162m-162 13h162m-162 13h118m-118 27h162m-162 13h162m-162 13h139" stroke="#846247" stroke-opacity=".68" stroke-width="2"/>
        </g>
        <g class="front-board motion">
          <rect width="222" height="310" rx="7" fill="url(#cloth)" stroke="#ee7c5c" stroke-width="1.2"/>
          <rect width="222" height="310" rx="7" fill="url(#weave)" opacity=".88"/>
          <path d="M20 2v306m-9-304v301" stroke="#761f22" stroke-width="2" opacity=".76"/>
          <path d="M17 49h-16m16 8h-16m16 193h-16m16 8h-16" stroke="#e9aa69" stroke-opacity=".77" stroke-width="2"/>
          <rect x="31" y="15" width="176" height="280" rx="2" fill="none" stroke="#e9bc76" stroke-width="1.4"/>
          <rect x="37" y="21" width="164" height="268" rx="1" fill="none" stroke="#e9bc76" stroke-opacity=".65"/>
          <use href="#star" fill="#efd098" transform="translate(119 79) scale(.9)"/>
          <use href="#engraving" transform="translate(119 156) scale(1.15)" color="#efd098"/>
          <path d="M61 230h116m-102 7h88" stroke="#efd098" stroke-opacity=".85"/>
          <use href="#star" fill="#efd098" transform="translate(119 261) scale(.56)"/>
          <g class="pastedown motion" opacity="0">
            <rect x="1" y="1" width="220" height="308" rx="7" fill="#992e27"/>
            <rect x="17" y="13" width="191" height="285" rx="2" fill="#dca96e"/>
            <rect x="17" y="13" width="191" height="285" rx="2" fill="url(#hatch)"/>
            <path d="M28 24h169v263H28Z" fill="none" stroke="#8b4c39"/>
          </g>
        </g>
