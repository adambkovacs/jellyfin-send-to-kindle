    </g>

    <g class="loose-sheet motion" opacity="0">
      <path d="M-28-36h42l14 13v59h-56Z" fill="#f6e6be" stroke="#8a503e" stroke-width="1.6"/>
      <path d="M14-36v13h14m-43 9h30m-30 7h30m-30 7h23m-23 7h30m-30 7h25" fill="none" stroke="#8a503e" stroke-width="1.4"/>
    </g>
  </g>
</svg>
