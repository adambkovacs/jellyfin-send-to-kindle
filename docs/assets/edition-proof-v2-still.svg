<svg id="once" xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title description">
  <title id="title">A missing author credit, added to the outgoing EPUB</title>
  <desc id="description">An ISBN goes to Google Books. After the plugin confirms the ISBN and title, the outgoing EPUB gets the missing author credit.</desc>
  <defs>
    <clipPath id="plate"><rect width="960" height="580" rx="8"/></clipPath>
    <linearGradient id="ink" x2="1" y2="1">
      <stop stop-color="#242b3e"/>
      <stop offset="1" stop-color="#141a2a"/>
    </linearGradient>
    <linearGradient id="paper" x2=".8" y2="1">
      <stop stop-color="#f4e7cb"/>
      <stop offset="1" stop-color="#e5cda4"/>
    </linearGradient>
    <pattern id="mesh" width="5" height="5" patternUnits="userSpaceOnUse">
      <path d="M0 .5h5m-4 2v2m2-3v1" fill="none" stroke="#f4e7cb" stroke-opacity=".14" stroke-width=".6"/>
      <path d="M0 3.5h5m-3-3v1m2 1v2" fill="none" stroke="#111a2a" stroke-opacity=".25" stroke-width=".7"/>
    </pattern>
    <path id="crop" fill="none" stroke="currentColor" stroke-width="1.5" d="M0 22V0h22"/>
    <path id="corner" d="M0 0v46h46Z"/>
    <path id="barcode" fill="none" stroke="currentColor" stroke-width="3" d="M0 0v26m7-26v26m4-26v26m9-26v26m7-26v26m4-26v26m9-26v26m8-26v26m4-26v26m7-26v26m8-26v26m4-26v26m9-26v26m4-26v26m6-26v26m8-26v26m7-26v26m4-26v26m8-26v26m7-26v26m4-26v26m8-26v26m7-26v26m4-26v26m8-26v26m7-26v26m4-26v26m8-26v26"/>
  </defs>
  <style>.isbn-highlight, .catalog-highlight { opacity: 0; }</style>

  <g clip-path="url(#plate)">
    <path d="M0 0h960v580H0Z" fill="url(#ink)"/>
    <path d="M0 0h960v580H0Z" fill="url(#mesh)" opacity=".37"/>
    <path d="M27 28h906v524H27Z" fill="none" stroke="#be935e" stroke-opacity=".67"/>
    <path d="M41 105h878M41 478h878" stroke="#be935e" stroke-opacity=".55"/>
    <g color="#ddae6c">
      <use href="#crop" transform="translate(27 28)"/>
      <use href="#crop" transform="translate(933 28) rotate(90)"/>
      <use href="#crop" transform="translate(933 552) rotate(180)"/>
      <use href="#crop" transform="translate(27 552) rotate(270)"/>
    </g>
    <text x="480" y="83" text-anchor="middle" fill="#f4e7cb" font-family="Baskerville, Georgia, serif" font-size="51">Fill in the author</text>
    <path d="M313 272h48m238 0h46" stroke="#d6a26b" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>
    <path d="m353 266 9 6-9 6m284-12 9 6-9 6" fill="none" stroke="#edbb77" stroke-width="2"/>

    <g transform="translate(59 143) rotate(-3 122 150)">
      <g class="input-card motion">
        <path d="M8 11h203l46 46v246H8Z" fill="#0f1221" opacity=".55"/>
        <path d="M0 0h203l46 46v250H0Z" fill="url(#paper)" stroke="#e8cb9d"/>
        <path d="M0 0h203l46 46v250H0Z" fill="url(#mesh)" opacity=".6"/>
        <use href="#corner" transform="translate(203 0)" fill="#bd955f"/>
        <path d="M23 81h203m-203 97h203m-203 58h203" stroke="#876744" stroke-opacity=".55"/>
        <text x="23" y="59" fill="#20243a" font-family="Baskerville, Georgia, serif" font-size="38" textLength="155" lengthAdjust="spacingAndGlyphs">Library EPUB</text>
        <g fill="#654832" font-family="'Avenir Next', Verdana, sans-serif" font-size="26" font-weight="600">
          <text x="23" y="126">ISBN</text>
          <text x="23" y="216">Title</text>
          <text x="23" y="273">Author</text>
        </g>
        <use href="#barcode" x="23" y="137" color="#554234"/>
        <rect class="isbn-highlight motion" x="17" y="131" width="215" height="38" fill="none" stroke="#a6352a" stroke-width="3"/>
        <path d="M96 210h127" stroke="#9c774e" stroke-width="4"/>
        <path d="M122 267h101" stroke="#a87153" stroke-width="2" stroke-dasharray="5 4"/>
      </g>
    </g>

    <g transform="translate(367 204)">
      <g class="catalog motion">
        <rect x="5" y="7" width="226" height="137" rx="3" fill="#0e1323" opacity=".53"/>
        <rect width="226" height="137" rx="3" fill="#a7352a" stroke="#da7958" stroke-width="1.4"/>
        <rect width="226" height="137" rx="3" fill="url(#mesh)"/>
        <rect x="8" y="8" width="210" height="121" rx="2" fill="none" stroke="#f0bd80" stroke-opacity=".74"/>
        <rect class="catalog-highlight motion" x="3" y="3" width="220" height="131" rx="3" fill="none" stroke="#fff0d2" stroke-width="3"/>
        <text x="113" y="55" text-anchor="middle" fill="#f4e7cb" font-family="Baskerville, Georgia, serif" font-size="37" textLength="178" lengthAdjust="spacingAndGlyphs">Google Books</text>
        <path d="M25 72h176" stroke="#f3ca90" stroke-opacity=".78"/>
        <text x="113" y="107" text-anchor="middle" fill="#ffe8bf" font-family="'Avenir Next', Verdana, sans-serif" font-weight="600" font-size="29">ISBN lookup</text>
      </g>
    </g>

    <g transform="translate(652 143) rotate(3 122 150)">
      <g class="output-card motion">
        <path d="M8 11h203l46 46v246H8Z" fill="#0f1221" opacity=".55"/>
        <path d="M0 0h203l46 46v250H0Z" fill="url(#paper)" stroke="#e8cb9d"/>
        <path d="M0 0h203l46 46v250H0Z" fill="url(#mesh)" opacity=".6"/>
        <use href="#corner" transform="translate(203 0)" fill="#bd955f"/>
        <path d="M23 81h203m-203 97h203m-203 58h203" stroke="#876744" stroke-opacity=".55"/>
        <text x="23" y="59" fill="#20243a" font-family="Baskerville, Georgia, serif" font-size="38" textLength="178" lengthAdjust="spacingAndGlyphs">Outgoing EPUB</text>
        <g fill="#654832" font-family="'Avenir Next', Verdana, sans-serif" font-size="26" font-weight="600">
          <text x="23" y="126">ISBN</text>
          <text x="23" y="216">Title</text>
          <text x="23" y="273">Author</text>
        </g>
        <use href="#barcode" x="23" y="137" color="#554234"/>
        <path d="M96 210h127" stroke="#9c774e" stroke-width="4"/>
        <g class="author-ink motion" transform="translate(123 248)">
          <rect width="102" height="32" rx="2" fill="#a6352a"/>
          <text x="51" y="23" text-anchor="middle" fill="#fff0d2" font-family="'Avenir Next', Verdana, sans-serif" font-size="23" font-weight="700">Added</text>
        </g>
      </g>
    </g>

    <g class="isbn-slip motion" opacity="0">
      <circle r="7" fill="#f5e7ca" stroke="#d6a26b" stroke-width="2"/>
    </g>
    <g class="author-slip motion" opacity="0">
      <circle r="7" fill="#ef795c" stroke="#f5e7ca" stroke-width="2"/>
    </g>

    <text x="480" y="528" text-anchor="middle" fill="#edca92" font-family="'Avenir Next', Verdana, sans-serif" font-weight="650" font-size="28" letter-spacing="1">The plugin checks both ISBN and title</text>
  </g>
</svg>
